# config.yaml
data:
  train_path: 'Dataset/Training Data.csv'
  test_path: 'Dataset/Test Data.csv'
  test_label_path: 'Dataset/Sample Prediction Dataset.csv'
  processed_dir: 'processed'
  normalized_data_path: 'normalized_data.csv'
  fused_features_path: 'fused_features.csv'
  graph_dir: 'charts'
  train_loss_dir: "charts/train_loss"

features:
  n_features: 5
  categorical_columns:
    - 'Married/Single'
    - 'House_Ownership'
    - 'Car_Ownership'
    - 'Profession'
    - 'CITY'
    - 'STATE'
  drop_columns:
    - 'Id'
  target_column: 'Risk_Flag'

feature_engineering:
  max_samples: 10000
  use_weighted_input_for_autoencoder: false  # If false, default to normalized input
  kraskov_mi:
    k_neighbors: 5

  # The following config Will change the final feature shape: 
  use_autoencoder: true
  append_autoencoder_features: true
  append_normalized_features: true

logging:
  level: 'INFO'
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

models:
  default_model: 'd_lstm_mlp'
  random_state: 42

  hyperparameters:
    d_lstm_mlp:
      lstm:
        epochs: 40
        learning_rate: 0.001
        batch_size: 64
        hidden_size: 64
        num_layers: 2
        dropout_rate: 0.2
        optimizer: "adam"
        bidirectional: false
      mlp:
        epochs: 40
        learning_rate: 0.001
        batch_size: 64
        hidden_layers: [256, 128, 64, 32]
        dropout_rate: 0.2
        optimizer: "adam"

    autoencoder:
      epochs: 40
      learning_rate: 0.001
      batch_size: 64
      encoding_size: 3
      hidden_layers: [128, 64, 32]
      dropout_rate: 0.2
      optimizer: "adam"

    d_lstm:
      epochs: 40
      learning_rate: 0.001
      batch_size: 64
      hidden_size: 64
      num_layers: 2
      dropout_rate: 0.2
      optimizer: "adam"
      bidirectional: false

    mlp:
      epochs: 40
      learning_rate: 0.001
      batch_size: 64
      hidden_layers: [256, 128, 64, 32]
      dropout_rate: 0.2
      optimizer: "adam"

    rnn:
      epochs: 40
      learning_rate: 0.001
      batch_size: 64
      hidden_size: 64
      num_layers: 2
      dropout_rate: 0.3
      optimizer: "adam"

    cnn_lightgbm:
      cnn:
        epochs: 40
        learning_rate: 0.001
        batch_size: 64
        conv_channels: [32, 64]
        kernel_size: 3
        dropout_rate: 0.2
        optimizer: "adam"
      lightgbm:
        num_leaves: 31
        learning_rate: 0.05
        num_boost_round: 100
        feature_fraction: 0.9

    dnn:
      epochs: 40
      learning_rate: 0.001
      batch_size: 64
      hidden_layers: [256, 128, 64, 32]
      dropout_rate: 0.2
      optimizer: "adam"

    xgboost:
      max_depth: 10
      learning_rate: 0.1
      num_boost_round: 100
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 1
      gamma: 0
      tree_method: 'hist'
